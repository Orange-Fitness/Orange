  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0907" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    // iPhone home-screen app: black-translucent draws white status-bar text over the page, which is
    // unreadable on Paper's light background. iOS reads this tag at launch, so pick it before anything
    // renders (a change of interface applies from the next launch).
    try { if (localStorage.getItem("orange_ui") === "paper") document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "default"); } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-title" content="Orange" />
